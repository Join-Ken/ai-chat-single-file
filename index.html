<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 聊天（多会话 · 记忆版 · 档案库）</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--border:#e5e7eb;--text:#1f2328;--muted:#6b7280;--primary:#2b7fff;--primary-weak:#e8f1ff;--danger:#d92d20;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{height:100dvh;overflow:hidden;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;}
  button{font:inherit;cursor:pointer;}
  #sidebar{width:230px;flex:0 0 230px;display:flex;flex-direction:column;background:#fbfbfc;border-right:1px solid var(--border);height:100%;transition:transform .2s;}
  .side-head{padding:8px;}
  #newBtn{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:600;}
  #newBtn:hover{background:var(--primary-weak);}
  #convList{flex:1;overflow-y:auto;padding:0 6px 6px;}
  .conv-item{display:flex;align-items:center;gap:4px;padding:8px;border-radius:7px;cursor:pointer;font-size:13px;color:#374151;margin-bottom:2px;}
  .conv-item:hover{background:#eef0f3;}
  .conv-item.active{background:var(--primary-weak);color:#0b4ea2;font-weight:600;}
  .conv-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .conv-del{border:none;background:transparent;color:#9ca3af;font-size:15px;padding:0 4px;border-radius:4px;visibility:hidden;}
  .conv-item:hover .conv-del,.conv-item.active .conv-del{visibility:visible;}
  .conv-del:hover{color:var(--danger);background:#fee4e2;}
  .side-foot{padding:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
  .side-foot button{padding:6px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12px;}
  .side-foot button:hover{background:#f3f4f6;}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}
  #topbar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);}
  #chatTitle{flex:1;margin:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{border:none;background:transparent;color:#4b5563;width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
  .icon-btn:hover{background:#f0f2f5;}
  #menuBtn{display:none;}
  #config{border-bottom:1px solid var(--border);background:var(--panel);padding:0 10px;}
  #config summary{cursor:pointer;padding:6px 0;font-size:12.5px;color:var(--muted);list-style:none;}
  #config summary::-webkit-details-marker{display:none;}
  #config summary::before{content:'▸ ';}
  #config[open] summary::before{content:'▾ ';}
  .cfg-body{padding-bottom:8px;display:grid;gap:6px;max-height:50vh;overflow-y:auto;}
  .cfg-body label{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:6px;font-size:12.5px;color:#374151;}
  .cfg-body input,.cfg-body textarea{width:100%;padding:5px 7px;border:1px solid #d8dbe0;border-radius:6px;font:inherit;font-size:12.5px;background:#fff;}
  .cfg-body input:focus,.cfg-body textarea:focus{outline:none;border-color:var(--primary);}
  .cfg-body textarea{resize:vertical;min-height:34px;}
  .cfg-body .sys-box{display:flex;gap:6px;align-items:flex-start;}
  .cfg-body .sys-box textarea{flex:1;min-width:0;}
  .cfg-body .chk-box{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#374151;cursor:pointer;padding:5px 0;}
  .cfg-body .chk-box input[type="checkbox"]{width:auto;margin:0;cursor:pointer;accent-color:var(--primary);flex:0 0 auto;padding:0;}
  .scope-toggle{flex:0 0 auto;padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11.5px;color:#374151;cursor:pointer;white-space:nowrap;}
  .scope-toggle:hover{background:#f3f4f6;}
  .scope-toggle.on{background:var(--primary-weak);border-color:#bcd7ff;color:#0b4ea2;}
  .cfg-actions{display:flex;align-items:center;gap:6px;}
  #saveCfgBtn{padding:5px 12px;border-radius:6px;border:1px solid #bcd7ff;background:var(--primary-weak);color:#0b4ea2;font-weight:600;font-size:12.5px;}
  #saveTip{font-size:12px;color:#0a7a2f;}
  #memoryPanel{border-bottom:1px solid var(--border);background:#fffdf5;padding:0 10px;}
  #memoryPanel summary{cursor:pointer;padding:6px 0;font-size:12.5px;color:#92700c;list-style:none;}
  #memoryPanel summary::-webkit-details-marker{display:none;}
  #memoryPanel summary::before{content:'▸ ';}
  #memoryPanel[open] summary::before{content:'▾ ';}
  .mem-body{padding-bottom:8px;display:grid;gap:5px;max-height:50vh;overflow-y:auto;}
  .mem-item{display:flex;align-items:center;gap:6px;font-size:12.5px;background:#fff;border:1px solid #f0e6c8;border-radius:6px;padding:4px 8px;}
  .mem-idx{color:#92700c;font-weight:600;flex:0 0 24px;}
  .mem-text{flex:1;word-break:break-word;}
  .mem-del{border:none;background:transparent;color:#c00;cursor:pointer;font-size:14px;}
  .mem-add{display:flex;gap:4px;}
  .mem-add input{flex:1;padding:5px;border:1px solid #d8dbe0;border-radius:6px;font-size:12.5px;}
  .mem-add button{padding:5px 10px;border-radius:6px;border:1px solid #bcd7ff;background:var(--primary-weak);font-size:12.5px;}
  .mem-scope{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:#92700c;background:#fef8e7;border:1px solid #f0e6c8;border-radius:6px;padding:5px 8px;margin:2px 0 4px;}
  .mem-scope button{padding:3px 10px;border-radius:6px;border:1px solid #d8dbe0;background:#fff;font-size:12px;color:#374151;}
  .mem-scope button:hover{background:#f3f4f6;}
  .mem-count{float:right;font-size:11px;font-weight:600;line-height:1.7;color:#92700c;background:#fef8e7;border:1px solid #f0e6c8;padding:0 7px;border-radius:9px;font-variant-numeric:tabular-nums;}
  /* 档案库面板 */
  #archivePanel{border-bottom:1px solid var(--border);background:#f5fbff;padding:0 10px;}
  #archivePanel summary{cursor:pointer;padding:6px 0;font-size:12.5px;color:#1e6a8a;list-style:none;font-weight:600;}
  #archivePanel summary::-webkit-details-marker{display:none;}
  #archivePanel summary::before{content:'▸ ';}
  #archivePanel[open] summary::before{content:'▾ ';}
  .archive-body{padding-bottom:8px;display:grid;gap:5px;max-height:55vh;overflow-y:auto;}
  .archive-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0 6px;}
  .archive-stats{font-size:12.5px;color:#1e6a8a;font-weight:600;}
  .archive-migrate{padding:4px 10px;border-radius:6px;border:1px solid #b8d9e8;background:#fff;font-size:12px;color:#1e6a8a;}
  .archive-migrate:hover{background:#e6f4fa;}
  .archive-section{display:flex;flex-direction:column;gap:5px;padding:6px 0;border-top:1px solid #e0eef5;}
  .archive-section:first-of-type{border-top:none;padding-top:0;}
  .archive-section.off .archive-section-title{opacity:.6;}
  .archive-section-head{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .archive-section-title{font-size:12.5px;color:#1e6a8a;font-weight:600;}
  .archive-section-count{font-size:11px;font-weight:400;color:#6b7280;background:#e6f4fa;padding:1px 6px;border-radius:8px;margin-left:4px;}
  .archive-switch{font-size:11.5px;color:#4b5563;display:flex;align-items:center;gap:4px;cursor:pointer;}
  .archive-switch input{cursor:pointer;margin:0;}
  .archive-empty{font-size:12.5px;color:#9ca3af;padding:6px 4px;text-align:center;}
  .archive-item{display:flex;flex-direction:column;gap:3px;font-size:12.5px;background:#fff;border:1px solid #b8d9e8;border-radius:6px;padding:5px 8px;}
  .archive-item.disabled{opacity:.55;}
  .archive-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .archive-num{font-size:11px;font-weight:600;color:#1e6a8a;background:#e6f4fa;padding:1px 6px;border-radius:3px;flex:0 0 auto;}
  .archive-name{font-weight:600;color:#1f2328;}
  .archive-tag{font-size:10.5px;padding:1px 5px;border-radius:3px;background:#e6f4fa;color:#1e6a8a;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .archive-actions{margin-left:auto;display:flex;gap:2px;}
  .archive-actions button{border:none;background:transparent;color:#6b7280;cursor:pointer;font-size:12px;padding:1px 4px;border-radius:3px;}
  .archive-actions button:hover{background:#eef0f3;color:var(--text);}
  .archive-content{color:#4b5563;word-break:break-word;white-space:pre-wrap;}
  .archive-edit{display:grid;gap:4px;padding:6px 8px;background:#f8fbfd;border:1px dashed #b8d9e8;border-radius:6px;margin-top:2px;}
  .archive-edit input,.archive-edit textarea{width:100%;padding:4px 6px;border:1px solid #d8dbe0;border-radius:5px;font:inherit;font-size:12px;background:#fff;}
  .archive-edit textarea{resize:vertical;min-height:50px;}
  .archive-edit-actions{display:flex;gap:6px;}
  .archive-edit-actions button{padding:4px 10px;border-radius:5px;font-size:12px;}
  .archive-edit-actions button[data-act="save"]{border:1px solid #bcd7ff;background:var(--primary-weak);color:#0b4ea2;font-weight:600;}
  .archive-edit-actions button[data-act="cancel"]{border:1px solid var(--border);background:#fff;color:#4b5563;}
  .archive-add{display:grid;gap:4px;margin-top:6px;padding:8px;background:#fff;border:1px dashed #b8d9e8;border-radius:6px;}
  .archive-add-hint{font-size:11.5px;color:#1e6a8a;font-weight:600;}
  .archive-add input,.archive-add textarea{width:100%;padding:4px 6px;border:1px solid #d8dbe0;border-radius:5px;font:inherit;font-size:12px;background:#fff;}
  .archive-add textarea{resize:vertical;min-height:44px;}
  .archive-add-btn{padding:5px 10px;border-radius:6px;border:1px solid #bcd7ff;background:var(--primary-weak);font-size:12.5px;justify-self:start;}
  #chatWrap{position:relative;flex:1;min-height:0;display:flex;}
  #chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;}
  .empty{margin:auto;color:#9ca3af;font-size:13px;}
  .msg{display:flex;flex-direction:column;max-width:min(760px,88%);}
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.ai{align-self:flex-start;align-items:flex-start;}
  .bubble{padding:8px 12px;border-radius:11px;line-height:1.6;word-break:break-word;overflow-wrap:anywhere;font-size:14px;}
  .msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .msg.ai .bubble{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.ai.error .bubble{background:#fff6f5;border-color:#ffd4d0;color:var(--danger);}
  .notice{color:#6b7280;font-size:12.5px;}
  .summary-bar{align-self:center;max-width:min(760px,92%);position:sticky;top:0;z-index:2;font-size:12px;color:#8a6d0b;background:#fffdf0;border:1px dashed #e8d9a3;border-radius:8px;padding:5px 10px;line-height:1.6;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .summary-bar .summary-toggle{border:none;background:transparent;color:#0b62d6;font-size:12px;padding:0;text-decoration:underline;}
  .summary-bar .summary-text{flex-basis:100%;color:#4b5563;white-space:pre-wrap;word-break:break-word;font-size:12.5px;}
  .rag-bar{align-self:center;max-width:min(760px,92%);font-size:12px;color:#5b6b8a;background:#f4f7fc;border:1px dashed #c8d8ef;border-radius:8px;padding:4px 10px;line-height:1.6;}
  .rag-bar[hidden]{display:none;}
  .notice-bar{align-self:center;max-width:min(760px,92%);font-size:12px;color:#7a5c00;background:#fffbe6;border:1px dashed #e8d9a3;border-radius:8px;padding:4px 10px;line-height:1.6;}
  .think-block{margin:0 0 8px;padding:6px 10px 8px;border:1px dashed #d7dae0;border-radius:8px;background:#fafbfc;}
  .think-head{display:flex;align-items:center;gap:6px;font-size:12px;color:#8b8f96;}
  .think-toggle{border:none;background:transparent;color:#0b62d6;font-size:12px;padding:0;text-decoration:underline;cursor:pointer;}
  .think-body{margin-top:5px;max-height:220px;overflow-y:auto;font-size:12.5px;line-height:1.65;color:#6b7280;white-space:pre-wrap;word-break:break-word;}
  .think-body[hidden]{display:none;}
  .actions{display:flex;gap:4px;margin-top:3px;opacity:0;transition:opacity .15s;align-items:center;}
  .msg:hover .actions{opacity:1;}
  .actions button{border:none;background:transparent;color:var(--muted);font-size:11.5px;padding:2px 6px;border-radius:4px;}
  .actions button:hover{background:#eef0f3;color:var(--text);}
  @media(hover:none){.actions{opacity:1;}}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:8px 0 4px;font-size:15px;line-height:1.4;}
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0;}
  .bubble ul,.bubble ol{margin:4px 0;padding-left:20px;}
  .bubble li{margin:1px 0;}
  .bubble blockquote{margin:4px 0;padding:4px 8px;border-left:3px solid #d0d7de;color:#57606a;background:#f6f8fa;border-radius:0 5px 5px 0;}
  .bubble a{color:#0b62d6;}
  .bubble code{font-family:Consolas,monospace;font-size:12.5px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;}
  .bubble pre.code{margin:6px 0;padding:9px 11px;background:#1f2430;color:#e6edf3;border-radius:8px;overflow-x:auto;line-height:1.5;}
  .bubble pre.code code{background:none;padding:0;color:inherit;font-size:12.5px;}
  .bubble .code-block{position:relative;margin:6px 0;}
  .bubble .code-block pre.code{margin:0;}
  .bubble .code-copy{position:absolute;top:6px;right:6px;z-index:2;padding:2px 8px;font-size:11.5px;line-height:1.6;border-radius:5px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.14);color:#dbe4ee;opacity:0;transition:opacity .15s;cursor:pointer;}
  .bubble .code-block:hover .code-copy{opacity:1;}
  @media(hover:none){.bubble .code-copy{opacity:1;}}
  .bubble .table-wrap{overflow-x:auto;margin:7px 0;max-width:100%;}
  .bubble table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5;}
  .bubble th,.bubble td{border:1px solid #dfe3e8;padding:5px 9px;text-align:left;vertical-align:top;word-break:break-word;overflow-wrap:break-word;}
  .bubble th{background:#f3f5f7;font-weight:600;}
  .bubble tbody tr:nth-child(even){background:#fafbfc;}
  .typing{display:inline-flex;gap:3px;align-items:center;height:16px;}
  .typing i{width:5px;height:5px;border-radius:50%;background:#9ca3af;animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;}
  .typing i:nth-child(3){animation-delay:.4s;}
  .caret{display:inline-block;width:6px;height:14px;background:var(--primary);vertical-align:-2px;border-radius:1px;animation:blink 1s steps(2) infinite;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  #toBottom{position:absolute;right:12px;bottom:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;color:#4b5563;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:13px;}
  #toBottom[hidden]{display:none;}
  #bottom{display:flex;gap:6px;align-items:flex-end;padding:8px 12px 10px;background:var(--panel);border-top:1px solid var(--border);}
  #input{flex:1;min-height:40px;max-height:160px;padding:9px 12px;resize:none;border:1px solid #d8dbe0;border-radius:10px;font:inherit;font-size:14px;line-height:1.5;outline:none;background:#fff;overflow-y:auto;}
  #input:focus{border-color:var(--primary);}
  #searchBtn{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:16px;line-height:1;opacity:.5;}
  #searchBtn.on{opacity:1;border-color:#bcd7ff;background:var(--primary-weak);}
  #sendBtn{padding:0 16px;height:40px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:600;}
  #sendBtn:hover:not(:disabled){background:#1c6ef0;}
  #sendBtn:disabled{background:#9ec3ff;cursor:not-allowed;}
  #stopBtn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--danger);font-weight:600;}
  #stopBtn[hidden]{display:none;}
  #scrim{display:none;}
  #trimModal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;}
  #trimModal[hidden]{display:none;}
  .trim-dialog{background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:min(440px,92vw);padding:18px 20px 14px;display:flex;flex-direction:column;gap:10px;}
  .trim-title{font-size:15px;font-weight:600;color:#1f2328;}
  .trim-msg{margin:0;font-size:13px;line-height:1.6;color:#374151;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;}
  .trim-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px;}
  .trim-actions button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);cursor:pointer;background:#fff;color:#374151;}
  .trim-actions button:hover{background:#f3f4f6;}
  .trim-actions button:disabled{cursor:wait;opacity:.65;}
  .trim-actions .trim-save{border-color:#bcd7ff;background:var(--primary-weak);color:#0b4ea2;}
  .trim-actions .trim-save:hover{background:#dbe9ff;}
  .trim-actions .trim-delete{border-color:#f5c2c0;background:#fff;color:#b42318;}
  .trim-actions .trim-delete:hover{background:#fee4e2;}
  @media(max-width:760px){
    #sidebar{position:fixed;z-index:30;left:0;top:0;height:100%;transform:translateX(-100%);box-shadow:0 0 24px rgba(0,0,0,.15);}
    #sidebar.open{transform:none;}
    #menuBtn{display:inline-flex;}
    .conv-del{visibility:visible;}
    #scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:25;}
    #scrim.show{display:block;}
    .msg{max-width:94%;}
  }
</style>
</head>
<body>

<div id="scrim"></div>

<div id="trimModal" hidden>
  <div class="trim-dialog">
    <div class="trim-title">修剪对话</div>
    <div id="trimModalMsg" class="trim-msg"></div>
    <div class="trim-actions">
      <button type="button" data-trim="save" class="trim-save">保存并删除</button>
      <button type="button" data-trim="delete" class="trim-delete">仅删除</button>
      <button type="button" data-trim="cancel" class="trim-cancel">取消</button>
    </div>
  </div>
</div>

<aside id="sidebar">
  <div class="side-head"><button id="newBtn">＋ 新建对话</button></div>
  <div id="convList"></div>
  <div class="side-foot">
    <button id="exportBtn">备份当前 (.json)</button>
    <button id="exportAllBtn">导出全部 (.json)</button>
    <button id="importBtn">导入 (.json)</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</aside>

<main id="main">

<div style="background:#fff3cd;border-bottom:1px solid #ffe69c;padding:6px 12px;font-size:12.5px;color:#7a5c00;text-align:center;flex:0 0 auto;">
  ⚠️ 本工具由 AI 生成，作者不維護、不提供技術支援。API Key 僅存於你的瀏覽器。
</div>

  <div id="topbar">
    <button id="menuBtn" class="icon-btn" title="会话列表">☰</button>
    <h1 id="chatTitle">新对话</h1>
    <button id="renameBtn" class="icon-btn" title="重命名">✎</button>
    <button id="sealBtn" class="icon-btn" title="压缩并封存（之后不再读取早期原文）">📦</button>
    <button id="trimBtn" class="icon-btn" title="修剪：只保留最近 240 条消息">✂️</button>
    <button id="clearBtn" class="icon-btn" title="清空当前对话">🧹</button>
  </div>

  <details id="config">
    <summary>API 设置</summary>
    <div class="cfg-body">
      <label>Base URL<input id="baseUrl" value="https://api.deepseek.com/v1"></label>
      <label>API Key<input id="apiKey" type="password" placeholder="在此填写 API Key" autocomplete="off"></label>

      <label>模型<input id="model" value="deepseek-chat"></label>
      <label>System<span class="sys-box"><textarea id="systemPrompt" rows="2" placeholder="可选：系统提示词"></textarea><button type="button" id="sysScopeBtn" class="scope-toggle" title="切换提示词作用范围">全局</button></span></label>
      <label>温度<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label>
      <label>搜索 Key<input id="searchKey" type="password" placeholder="可选：tavily.com 的 key，用于联网" autocomplete="off"></label>
      <label>完整档案<span class="chk-box"><input type="checkbox" id="allowArchiveFull"><span>让 AI 在需要时看完整档案</span></span></label>

<script>
/* ============ 基础工具 ============ */
let seq = 0;
function uid(p){ seq = (seq + 1) % 100000; return p + '_' + Date.now().toString(36) + '_' + seq.toString(36) + Math.random().toString(36).slice(2, 6); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (navigator.maxTouchPoints > 1);

/* 把模型输出的 Markdown 转成 HTML。 */
function mdToHtml(src){
  let s = escapeHtml(src == null ? '' : src);
  const BT = String.fromCharCode(96);
  const FENCE = BT + BT + BT;
  const blocks = [];
  const inls = [];
  let guard = 0;

  while(guard++ < 500){
    const i = s.indexOf(FENCE);
    if(i < 0) break;
    const bodyStart = i + FENCE.length;
    const j = s.indexOf(FENCE, bodyStart);
    const codeRaw = j < 0 ? s.slice(bodyStart) : s.slice(bodyStart, j);
    const endPos = j < 0 ? s.length : j + FENCE.length;
    const code = codeRaw
      .replace(/^[ \t]*[A-Za-z0-9+#._-]*[ \t]*\r?\n/, '')
      .replace(/\n+$/, '');
    const ph = '\u0000' + blocks.length + '\u0000';
    blocks.push('<div class="code-block"><button type="button" class="code-copy">复制</button><pre class="code"><code>' + code + '</code></pre></div>');
    s = s.slice(0, i) + ph + s.slice(endPos);
  }

  let k = 0;
  while(k++ < 500){
    const a = s.indexOf(BT);
    if(a < 0) break;
    const b = s.indexOf(BT, a + 1);
    if(b < 0){ s = s.slice(0, a) + s.slice(a + 1); continue; }
    const inner = s.slice(a + 1, b);
    if(inner.indexOf('\n') >= 0){ s = s.slice(0, a) + s.slice(a + 1); continue; }
    const ph2 = '\u0001' + inls.length + '\u0001';
    inls.push('<code>' + inner + '</code>');
    s = s.slice(0, a) + ph2 + s.slice(b + 1);
  }

  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  s = s.replace(/^[ \t]{0,3}(#{1,6})[ \t]+(.*)$/gm, (m, hashes, text) => {
    const lv = Math.min(hashes.length, 6);
    return '<h' + lv + '>' + text + '</h' + lv + '>';
  });

  {
    const lines = s.split('\n');
    const out = [];
    let buf = [];
    const flush = () => {
      if(buf.length) out.push('<blockquote>' + buf.join('<br>') + '</blockquote>');
      buf = [];
    };
    for(const ln of lines){
      const m = ln.match(/^[ \t]*&gt;[ \t]?(.*)$/);
      if(m) buf.push(m[1]);
      else { flush(); out.push(ln); }
    }
    flush();
    s = out.join('\n');
  }

  {
    const lines = s.split('\n');
    const out = [];
    const splitCells = ln => {
      let t = String(ln == null ? '' : ln).trim();
      if(t.charAt(0) === '|') t = t.slice(1);
      if(t.charAt(t.length - 1) === '|') t = t.slice(0, -1);
      return t.split('|').map(c => c.trim());
    };
    const isSepLine = ln => {
      const t = String(ln == null ? '' : ln).trim();
      if(t === '' || t.indexOf('-') < 0) return false;
      return /^[|:\-\s]+$/.test(t);
    };
    const cellInner = c => String(c == null ? '' : c).replace(/\u0001(\d+)\u0001/g, (m, n) => inls[+n] || '');
    let i2 = 0;
    while(i2 < lines.length){
      const cur = lines[i2];
      const nxt = lines[i2 + 1];
      if(cur != null && nxt != null && cur.indexOf('|') >= 0 && isSepLine(nxt)){
        const heads = splitCells(cur);
        const seps = splitCells(nxt);
        let j2 = i2 + 2;
        const rows = [];
        while(j2 < lines.length && lines[j2].indexOf('|') >= 0 && lines[j2].trim() !== ''){
          rows.push(splitCells(lines[j2]));
          j2++;
        }
        if(heads.length && heads.some(h2 => h2 !== '')){
          const aligns = heads.map((h2, n) => {
            const c = seps[n] || '';
            const l = c.charAt(0) === ':';
            const r = c.charAt(c.length - 1) === ':';
            return l && r ? 'center' : (r ? 'right' : (l ? 'left' : ''));
          });
          let html = '<div class="table-wrap"><table><thead><tr>';
          heads.forEach((h2, n) => {
            html += '<th' + (aligns[n] ? ' style="text-align:' + aligns[n] + '"' : '') + '>' + cellInner(h2) + '</th>';
          });
          html += '</tr></thead><tbody>';
          rows.forEach(r => {
            html += '<tr>';
            heads.forEach((h2, n) => {
              html += '<td' + (aligns[n] ? ' style="text-align:' + aligns[n] + '"' : '') + '>' + cellInner(r[n]) + '</td>';
            });
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          out.push('\u0000' + blocks.length + '\u0000');
          blocks.push(html);
          i2 = j2;
          continue;
        }
      }
      out.push(cur);
      i2++;
    }
    s = out.join('\n');
  }

  {
    const lines = s.split('\n');
    const out = [];
    let curTag = '';
    let buf = [];
    const flush = () => {
      if(curTag && buf.length) out.push('<' + curTag + '>' + buf.join('') + '</' + curTag + '>');
      curTag = ''; buf = [];
    };
    const isRule = ln => /^[ \t]*([-*_])[ \t]*(?:\1[ \t]*){2,}$/.test(ln);
    for(const ln of lines){
      if(isRule(ln)){ flush(); out.push('\u0000' + blocks.length + '\u0000'); blocks.push('<hr>'); continue; }
      const mUl = ln.match(/^[ \t]*[-*+][ \t]+(.*)$/);
      const mOl = mUl ? null : ln.match(/^[ \t]*\d+[.)][ \t]+(.*)$/);
      if(mUl){
        if(curTag !== 'ul'){ flush(); curTag = 'ul'; }
        buf.push('<li>' + mUl[1] + '</li>');
      }else if(mOl){
        if(curTag !== 'ol'){ flush(); curTag = 'ol'; }
        buf.push('<li>' + mOl[1] + '</li>');
      }else{
        flush();
        out.push(ln);
      }
    }
    flush();
    s = out.join('\n');
  }

  s = s.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n');
  s = s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');

  s = s.replace(/\u0001(\d+)\u0001/g, (m, n) => inls[+n] || '');
  s = s.replace(/(?:<br>)*\u0000(\d+)\u0000(?:<br>)*/g, (m, n) => blocks[+n] || '');
  return s;
}

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((resolve, reject) => {
    try{
      const ta = document.createElement('textarea');
      ta.value = t;
      ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    }catch(e){ reject(e); }
  });
}

/* 只用于显示：剥离 RPG 版标签，不写回存储。普通版不产生这些标签，但导入 RPG 对话时可能会有。 */
function stripRpgTagsForDisplay(text){

  t = t.replace(/\[LORE_ADD\][\s\S]*?\[\/LORE_ADD\]/g, '');

  t = t.replace(/\[LORE_DELETE\][\s\S]*?\[\/LORE_DELETE\]/g, '');
  t = t.replace(/\[ROLL\][\s\S]*?\[\/ROLL\]/gi, '');
  return t.trim();
}

/* ============ IndexedDB ============ */
const DB_NAME = 'ChatAppDB', DB_VERSION = 1, STORE = 'conversations';
let db = null;
const allConvs = {};
let currentId = null;
let busy = false;
let activeReq = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(conv){
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readwrite').objectStore(STORE).put(conv);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ============ 上下文摘要 ============ */
function stripCodeForSummary(text){
  const BT = String.fromCharCode(96);
  const FENCE = BT + BT + BT;
  let s = String(text || '');
  const re = new RegExp(FENCE + '[^\\n]*\\n([\\s\\S]*?)' + FENCE, 'g');
  s = s.replace(re, (m, body) => {
    const lines = body.split('\n');
    const head = lines.slice(0, 2).join(' ').replace(/\s+/g, ' ').trim().slice(0, 150);
    return '\n[代码块，约 ' + lines.length + ' 行，开头：' + head + ' ……其余省略]\n';
  });
  s = s.replace(/\n{3,}/g, '\n\n');
  if(s.length > 1500) s = s.slice(0, 1500) + '…';
  return s.trim();
}

const SUMMARY_TRIGGER = 40;
const SUMMARY_KEEP = 16;
const SUMMARY_MIN_BATCH = 12;
const SUMMARY_MAX_CHARS = 800;

let summaryBusy = false;
let summaryConvId = null;
let lastSummaryTry = 0;

function summaryPromptOf(oldSummary, batchText){
  return '你的任务是把聊天记录压缩成一段"前情提要"，供之后继续对话时参考。\n\n'
    + (oldSummary ? '【已有的前情提要】\n' + oldSummary + '\n\n' : '')
    + '【需要合并进去的新对话】\n' + batchText + '\n\n'
    + '要求：\n'
    + '1. 输出更新后的完整前情提要，把已有提要和新的对话合成一段连贯内容，不要出现"新增""补充"这类字样。\n'
    + '2. 重点保留：双方的身份和称呼、用户的偏好与禁忌、正在做的项目及进度、达成过的约定或结论、用户提过的重要事实、明确还没做完的事。\n'
    + '3. 对话中出现的具体事实务必保留原样：文件/变量/函数名、代码改动的位置、数字和参数、用户明确说过的要求、定了的决定、还没解决的问题。宁可长一点，也不要模糊成"讨论了一些代码问题"。\n'
    + '4. 用简洁陈述句，不要寒暄客套，不要评价对话本身。\n'
    + '5. 不超过 ' + SUMMARY_MAX_CHARS + ' 字。\n'
    + '6. 直接输出前情提要正文，不要任何前缀、标题或解释。';
}

async function maybeSummarize(conv, cfg, force){
  if(summaryBusy || !cfg.apiKey) return false;
  const total = conv.messages.length;
  const summarized = conv.summarized || 0;
  let end;

  if(force){
    end = Math.max(summarized, total - 2);
    if(end <= summarized) return true;
  }else{
    if(total - summarized < SUMMARY_TRIGGER) return true;
    end = total - SUMMARY_KEEP;
    if(end - summarized < SUMMARY_MIN_BATCH) return true;
    if(Date.now() - lastSummaryTry < 60000) return true;
  }

  const batch = conv.messages.slice(summarized, end)
    .filter(m => !m.pending && !m.error && m.content && m.content.trim());
  if(!batch.length){
    conv.summarized = Math.min(end, conv.messages.length);
    try{ await dbPut(conv); }catch(e){}
    return true;
  }

  const batchText = batch.map(m => {
    const who = m.role === 'user' ? '用户：' : 'AI：';
    return who + stripCodeForSummary(m.content);
  }).join('\n\n');

  summaryBusy = true;
  summaryConvId = conv.id;
  lastSummaryTry = Date.now();
  let ok = false;
  try{
    let sig;
    try{ sig = AbortSignal.timeout(120000); }catch(e){ sig = undefined; }
    const resp = await fetch(endpoint(cfg.baseUrl), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: cfg.model,
        messages: [{ role: 'user', content: summaryPromptOf(conv.summary || '', batchText) }],
        stream: false,
        temperature: 0.3
      }),
      signal: sig
    });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const c = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    const text = typeof c === 'string' ? c.trim() : '';
    if(!text) throw new Error('摘要为空');
    conv.summary = text;
    conv.summarized = Math.min(end, conv.messages.length);
    conv.updatedAt = Date.now();
    try{ await dbPut(conv); }catch(e){}
    if(currentId === conv.id) syncSummaryBar(conv);
    ok = true;
  }catch(e){
    console.warn('摘要失败（不影响正常对话）：', e);
    ok = false;
  }finally{
    summaryBusy = false;
    summaryConvId = null;
  }
  return ok;
}

/* ============ 向量检索（本地稀疏向量 · TF-IDF 余弦） ============ */
const RAG_TOP_K = 4;
const RAG_MIN_SCORE = 0.28;
const RAG_MAX_POOL = 240;
const RAG_SNIPPET_MAX = 700;

const vecCache = new WeakMap();
function getMsgVec(m){
  let c = vecCache.get(m);
  if(c) return c;
  const text = stripCodeForSummary(m.content);
  c = { text: text, vec: toVector(text) };
  vecCache.set(m, c);
  return c;
}

function tokenize(text){
  const out = [];
  const s = String(text || '').toLowerCase();
  const words = s.match(/[a-z0-9_$.]{2,}/g);
  if(words) for(const w of words) out.push('w:' + w);
  const cjkSegs = s.match(/[\u4e00-\u9fa5]+/g) || [];
  for(const seg of cjkSegs){
    if(seg.length === 1){ out.push('c:' + seg); continue; }
    for(let i = 0; i < seg.length - 1; i++) out.push('c:' + seg.slice(i, i + 2));
  }
  return out;
}
function toVector(text){
  const tf = new Map();
  const toks = tokenize(text);
  for(const t of toks) tf.set(t, (tf.get(t) || 0) + 1);
  return tf;
}

function retrieveRelevant(conv, query, topK){
  if(conv.sealed) return { note: '', hits: 0 };
  const summarized = conv.summarized || 0;
  if(!summarized) return { note: '', hits: 0 };
  const start = Math.max(0, summarized - RAG_MAX_POOL);

  const pool = [];
  for(let i = start; i < summarized; i++){
    const m = conv.messages[i];
    if(!m || !m.content || m.pending || m.error) continue;
    const c = getMsgVec(m);
    if(c.text.replace(/\s/g, '').length < 12) continue;
    pool.push({ m: m, text: c.text, vec: c.vec });
  }
  if(!pool.length) return { note: '', hits: 0 };

  const qVec = toVector(query);
  if(!qVec.size) return { note: '', hits: 0 };

  const df = new Map();
  for(const d of pool){
    for(const t of d.vec.keys()) df.set(t, (df.get(t) || 0) + 1);
  }
  const N = pool.length;
  const idfMap = new Map();
  for(const [t, c] of df) idfMap.set(t, Math.log(1 + (N - c + 0.5) / (c + 0.5)));
  const idfOf = t => idfMap.get(t) || 0;

  let qNorm = 0;
  const qW = new Map();
  for(const [t, f] of qVec){
    if(!df.has(t)) continue;
    const w = (1 + Math.log(f)) * idfOf(t);
    if(!w) continue;
    qW.set(t, w);
    qNorm += w * w;
  }
  qNorm = Math.sqrt(qNorm);
  if(!qNorm) return { note: '', hits: 0 };

  const scored = [];
  for(const d of pool){
    let dot = 0, dNorm = 0;
    for(const [t, f] of d.vec){
      const w = (1 + Math.log(f)) * idfOf(t);
      dNorm += w * w;
      const qw = qW.get(t);
      if(qw) dot += qw * w;
    }
    dNorm = Math.sqrt(dNorm);
    if(!dNorm || !dot) continue;
    scored.push({ d: d, score: dot / (qNorm * dNorm) });
  }
  if(!scored.length) return { note: '', hits: 0 };

  scored.sort((a, b) => b.score - a.score);
  const picked = scored.slice(0, topK).filter(x => x.score >= RAG_MIN_SCORE);
  if(!picked.length) return { note: '', hits: 0 };

  picked.sort((a, b) => conv.messages.indexOf(a.d.m) - conv.messages.indexOf(b.d.m));
  const note = picked.map(x => {
    const body = x.d.text;
    const t = body.length > RAG_SNIPPET_MAX ? body.slice(0, RAG_SNIPPET_MAX) + '…' : body;
    return (x.d.m.role === 'user' ? '用户：' : 'AI：') + t;
  }).join('\n\n');
  return { note: note, hits: picked.length };
}

/* ============ 记忆系统 ============ */
const MEM_SOFT_LIMIT = 18;

}

  localStorage.setItem('chatMemory', JSON.stringify(mem));
}

  return getMemory();
}

    conv.memory = mem;
    try{ dbPut(conv).catch(() => {}); }catch(e){}
  }else{
    saveMemory(mem);
  }

/* 浏览器存储用量：MB / MB（上限）。navigator.storage.estimate() 返回字节。 */
async function updateMemUsage(){
  const el = document.getElementById('memCount');
  if(!el) return;
  const fmt = n => {
    if(!n) return '0 MB';
    const mb = n / 1048576;
    if(mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
    if(mb >= 10) return mb.toFixed(0) + ' MB';
    return mb.toFixed(1) + ' MB';
  };
  let used = 0, quota = 0, ok = false;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      used = est.usage || 0;
      quota = est.quota || 0;
      ok = true;
    }
  }catch(e){}
  if(!ok){ el.textContent = '存儲 瀏覽器未提供'; el.title = '当前浏览器不提供存储用量信息'; return; }
  el.textContent = '存儲 ' + fmt(used) + ' / ' + (quota ? fmt(quota) : '?');
  el.title = '浏览器已为本页分配 ' + (quota ? fmt(quota) : '未知') + '，当前已用 ' + fmt(used);
}

  updateMemUsage();
  const body = document.getElementById('memBody');

    '</div>'
  ) : '';
  const adder = '<div class="mem-add"><input id="memAddInput" placeholder="手动添加一条记忆..."><button id="memAddBtn">添加</button></div>';
  const listHtml = mem.length
    ? mem.map((m, i) => (
        '<div class="mem-item">' +
          '<span class="mem-idx">' + (i + 1) + '.</span>' +
          '<span class="mem-text">' + escapeHtml(m.content) + '</span>' +
          '<button class="mem-del" data-mi="' + i + '" title="删除">×</button>' +
        '</div>'
      )).join('')
    : '<div style="font-size:12.5px;color:#9ca3af;padding:4px 0;">还没有记忆。AI 会自动记住重要信息，你也可以手动添加。</div>';
  body.innerHTML = scopeBar + listHtml + adder;
  body.querySelectorAll('.mem-del').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.mi, 10);
      const c = allConvs[currentId];
      const list = getMemoryOf(c).slice();
      list.splice(i, 1);
      saveMemoryOf(c, list);
      renderMemory();
    };
  });
  const addBtn = document.getElementById('memAddBtn');
  if(addBtn) addBtn.onclick = addMemoryManual;
  const scopeBtn = document.getElementById('memScopeBtn');
  if(scopeBtn) scopeBtn.onclick = () => {
    const c = allConvs[currentId];
    if(!c) return;
    if(c.memScope === 'isolated'){
      c.memScope = 'global';
    }else{
      c.memScope = 'isolated';
      if(!Array.isArray(c.memory)) c.memory = [];
    }
    c.updatedAt = Date.now();
    try{ dbPut(c).catch(() => {}); }catch(e){}
    renderMemory();
  };
}
function addMemoryManual(){
  const inp = document.getElementById('memAddInput');
  if(!inp) return;
  const v = inp.value.trim();
  if(!v) return;
  const conv = allConvs[currentId];
  const mem = getMemoryOf(conv).slice();
  mem.push({ content: v });
  saveMemoryOf(conv, mem);
  inp.value = '';
  renderMemory();
}
function processMemoryTags(text, conv){
  const mem = getMemoryOf(conv).slice();
  let changed = false;
  const dels = [];
  text = text.replace(/\[MEMORY_ADD\]([\s\S]*?)\[\/MEMORY_ADD\]/g, (m, c) => {
    const v = c.trim();
    if(v){ mem.push({ content: v }); changed = true; }
    return '';
  });
  text = text.replace(/\[MEMORY_UPDATE\]\s*(\d+)\s*=>\s*([\s\S]*?)\[\/MEMORY_UPDATE\]/g, (m, idx, c) => {
    const i = parseInt(idx, 10) - 1;
    const v = c.trim();
    if(i >= 0 && i < mem.length && v){ mem[i].content = v; changed = true; }
    return '';
  });
  text = text.replace(/\[MEMORY_DELETE\]\s*(\d+)\s*\[\/MEMORY_DELETE\]/g, (m, idx) => {
    const i = parseInt(idx, 10) - 1;
    if(i >= 0) dels.push(i);
    return '';
  });
  if(dels.length){
    const uniq = Array.from(new Set(dels)).sort((a, b) => b - a);
    for(const i of uniq){
      if(i < mem.length){ mem.splice(i, 1); changed = true; }
    }
  }
  if(changed){ saveMemoryOf(conv, mem); renderMemory(); }
  return { text: text.trim(), changed: changed };
}

/* ============ 档案库（全局 + 独立） ============ */
const ARCHIVE_SOFT_LIMIT = 40;
const ARCHIVE_INJECT_TOP_K = 4;
const ARCHIVE_CONTENT_MAX = 800;
const ARCHIVE_FULL_MAX = 2;
const GLOBAL_ARCHIVE_KEY = 'chatGlobalArchives';

function getGlobalArchives(){
  try{
    const arr = JSON.parse(localStorage.getItem(GLOBAL_ARCHIVE_KEY) || '[]');
    return Array.isArray(arr) ? arr.map(normArchiveItem) : [];
  }catch(e){ return []; }
}
function saveGlobalArchives(arr){
  localStorage.setItem(GLOBAL_ARCHIVE_KEY, JSON.stringify(arr));
}
function getLocalArchives(conv){
  if(!conv || !Array.isArray(conv.archives)) return [];
  return conv.archives;
}
function saveArchivesOf(conv, archives){
  if(!conv) return;
  conv.archives = archives;
  conv.updatedAt = Date.now();
  try{ dbPut(conv).catch(() => {}); }catch(e){}
}
function normArchiveItem(x){
  return {
    key: x.key || uid('a'),
    name: String(x.name || ''),
    keywords: Array.isArray(x.keywords) ? x.keywords.map(s => String(s)) : [],
    content: String(x.content || ''),
    enabled: x.enabled !== false
  };
}
function isGlobalOn(conv){ return !!(conv && conv.useGlobalArchive !== false); }
function isLocalOn(conv){ return !!(conv && conv.useLocalArchive !== false); }
function parseArchiveId(id){
  const m = String(id || '').trim().match(/^([GI])(\d+)$/i);
  if(!m) return null;
  return { scope: m[1].toUpperCase() === 'G' ? 'global' : 'local', idx: parseInt(m[2], 10) - 1 };
}
function totalVisibleArchives(conv){
  return (isGlobalOn(conv) ? getGlobalArchives().length : 0) + (isLocalOn(conv) ? getLocalArchives(conv).length : 0);
}

let archiveEditing = null;

function renderArchives(){
  const body = document.getElementById('archiveBody');
  if(!body) return;
  const conv = allConvs[currentId];
  if(!conv) return;

  const globals = getGlobalArchives();
  const locals = getLocalArchives(conv);
  const gOn = isGlobalOn(conv);
  const lOn = isLocalOn(conv);

  /* 保存添加区当前值 */
  const oldAdds = {};
  body.querySelectorAll('.archive-add').forEach(el => {
    oldAdds[el.dataset.scope] = {
      name: el.querySelector('.add-name').value,
      kw: el.querySelector('.add-keywords').value,
      content: el.querySelector('.add-content').value
    };
  });

  /* 同步编辑区当前值 */
  body.querySelectorAll('.archive-edit').forEach(el => {
    if(!archiveEditing) return;
    if(el.dataset.scope !== archiveEditing.scope || el.dataset.key !== archiveEditing.key) return;
    archiveEditing.name = el.querySelector('.edit-name').value;
    archiveEditing.keywords = el.querySelector('.edit-keywords').value;
    archiveEditing.content = el.querySelector('.edit-content').value;
  });

  const sectionHtml = (scope, label, arr, on) => {
    const prefix = scope === 'global' ? 'G' : 'I';
    let items;
    if(!arr.length){
      items = '<div class="archive-empty">「' + label + '」还没有档案。</div>';
    }else{
      items = arr.map((it, i) => {
        const num = prefix + (i + 1);
        const editing = archiveEditing && archiveEditing.scope === scope && archiveEditing.key === it.key;
        const dis = it.enabled === false;
        let h = '<div class="archive-item' + (dis ? ' disabled' : '') + '" data-scope="' + scope + '" data-key="' + escapeHtml(it.key) + '">'
          + '<div class="archive-head">'
          + '<span class="archive-num">' + num + '</span>'
          + '<span class="archive-name">' + escapeHtml(it.name) + '</span>'
          + '<span class="archive-tag">' + escapeHtml((it.keywords || []).join('、')) + '</span>'
          + '<span class="archive-actions">'
          + '<button data-act="toggle" title="启用/禁用">' + (dis ? '○' : '●') + '</button>'
          + '<button data-act="edit" title="编辑">✎</button>'
          + '<button data-act="del" title="删除">×</button>'
          + '</span>'
          + '</div>'
          + '<div class="archive-content">' + escapeHtml(it.content) + '</div>';
        if(editing){
          h += '<div class="archive-edit" data-scope="' + scope + '" data-key="' + escapeHtml(it.key) + '">'
            + '<input class="edit-name" placeholder="名称" value="' + escapeHtml(archiveEditing.name) + '">'
            + '<input class="edit-keywords" placeholder="关键词，逗号分隔" value="' + escapeHtml(archiveEditing.keywords) + '">'
            + '<textarea class="edit-content" placeholder="内容" rows="3">' + escapeHtml(archiveEditing.content) + '</textarea>'
            + '<div class="archive-edit-actions">'
            + '<button data-act="save">保存</button>'
            + '<button data-act="cancel">取消</button>'
            + '</div>'
            + '</div>';
        }
        h += '</div>';
        return h;
      }).join('');
    }

    const addCache = oldAdds[scope] || {};
    const addHtml = on ? ('<div class="archive-add" data-scope="' + scope + '">'
      + '<div class="archive-add-hint">添加到「' + label + '」</div>'
      + '<input class="add-name" placeholder="名称" value="' + escapeHtml(addCache.name || '') + '">'
      + '<input class="add-keywords" placeholder="触发关键词，逗号分隔" value="' + escapeHtml(addCache.kw || '') + '">'
      + '<textarea class="add-content" placeholder="档案内容（命中时注入给 AI）" rows="2">' + escapeHtml(addCache.content || '') + '</textarea>'
      + '<button class="archive-add-btn" type="button" data-scope="' + scope + '">添加档案</button>'
      + '</div>') : '';

    return '<div class="archive-section' + (on ? '' : ' off') + '">'
      + '<div class="archive-section-head">'
      + '<span class="archive-section-title">' + label + ' <span class="archive-section-count">' + arr.length + '</span></span>'
      + '<label class="archive-switch"><input type="checkbox" class="archive-switch-cb" data-scope="' + scope + '"' + (on ? ' checked' : '') + '> 启用</label>'
      + '</div>'
      + (on ? (items + addHtml) : '<div class="archive-empty">已关闭，本对话不使用这个库。</div>')
      + '</div>';
  };

  const migrateBtn = locals.length
    ? '<button class="archive-migrate" type="button">把独立档案迁入全局</button>'
    : '';

  body.innerHTML = '<div class="archive-topbar">'
    + '<span class="archive-stats">全局 ' + globals.length + ' / 独立 ' + locals.length + '</span>'
    + migrateBtn
    + '</div>'
    + sectionHtml('global', '全局档案', globals, gOn)
    + sectionHtml('local', '独立档案', locals, lOn);

  /* 开关 */
  body.querySelectorAll('.archive-switch-cb').forEach(cb => {
    cb.onchange = () => {
      if(cb.dataset.scope === 'global') conv.useGlobalArchive = cb.checked;
      else conv.useLocalArchive = cb.checked;
      conv.updatedAt = Date.now();
      dbPut(conv).catch(() => {});
      renderArchives();
    };
  });

  /* 迁移按钮 */
  const mBtn = body.querySelector('.archive-migrate');
  if(mBtn) mBtn.onclick = migrateLocalToGlobal;

  /* 档案上的三个按钮（toggle/edit/del） */
  body.querySelectorAll('.archive-actions button').forEach(btn => {
    btn.onclick = () => {
      const item = btn.closest('.archive-item');
      const scope = item.dataset.scope;
      const key = item.dataset.key;
      const arr = (scope === 'global' ? getGlobalArchives() : getLocalArchives(conv)).slice();
      const idx = arr.findIndex(x => x.key === key);
      if(idx < 0) return;
      const act = btn.dataset.act;
      if(act === 'del'){
        if(!confirm('删除档案「' + arr[idx].name + '」？')) return;
        arr.splice(idx, 1);
        if(scope === 'global') saveGlobalArchives(arr);
        else saveArchivesOf(conv, arr);
        if(archiveEditing && archiveEditing.scope === scope && archiveEditing.key === key) archiveEditing = null;
        renderArchives();
      }else if(act === 'toggle'){
        arr[idx].enabled = arr[idx].enabled === false ? true : false;
        if(scope === 'global') saveGlobalArchives(arr);
        else saveArchivesOf(conv, arr);
        renderArchives();
      }else if(act === 'edit'){
        archiveEditing = {
          scope: scope,
          key: key,
          name: arr[idx].name,
          keywords: (arr[idx].keywords || []).join(','),
          content: arr[idx].content
        };
        renderArchives();
      }
    };
  });

  /* 编辑区的保存/取消 */
  body.querySelectorAll('.archive-edit-actions button').forEach(btn => {
    btn.onclick = () => {
      const editEl = btn.closest('.archive-edit');
      const scope = editEl.dataset.scope;
      const key = editEl.dataset.key;
      const act = btn.dataset.act;
      if(act === 'cancel'){
        archiveEditing = null;
        renderArchives();
        return;
      }
      if(act === 'save'){
        const newName = editEl.querySelector('.edit-name').value.trim();
        const kwRaw = editEl.querySelector('.edit-keywords').value.trim();
        const newContent = editEl.querySelector('.edit-content').value.trim();
        if(!newName || !newContent){ alert('名称和内容不能为空'); return; }
        const arr = (scope === 'global' ? getGlobalArchives() : getLocalArchives(conv)).slice();
        const idx = arr.findIndex(x => x.key === key);
        if(idx < 0) return;
        const dup = arr.find((x, j) => j !== idx && x.name === newName);
        if(dup){ alert('已有同名档案「' + newName + '」，请换个名称'); return; }
        const newKeywords = kwRaw ? kwRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [newName];
        arr[idx].name = newName;
        arr[idx].keywords = newKeywords;
        arr[idx].content = newContent;
        if(scope === 'global') saveGlobalArchives(arr);
        else saveArchivesOf(conv, arr);
        archiveEditing = null;
        renderArchives();
      }
    };
  });

  /* 添加按钮 */
  body.querySelectorAll('.archive-add-btn').forEach(btn => {
    btn.onclick = () => {
      const scope = btn.dataset.scope;
      const addEl = btn.closest('.archive-add');
      const name = addEl.querySelector('.add-name').value.trim();
      const kwRaw = addEl.querySelector('.add-keywords').value.trim();
      const content = addEl.querySelector('.add-content').value.trim();
      if(!name || !content){ alert('名称和内容不能为空'); return; }
      const arr = (scope === 'global' ? getGlobalArchives() : getLocalArchives(conv)).slice();
      if(arr.find(x => x.name === name)){
        alert('已有同名档案「' + name + '」，请换个名称或先编辑旧档案');
        return;
      }
      const keywords = kwRaw ? kwRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [name];
      arr.push({ key: uid('a'), name: name, keywords: keywords, content: content, enabled: true });
      if(scope === 'global') saveGlobalArchives(arr);
      else saveArchivesOf(conv, arr);
      renderArchives();
    };
  });

  /* 编辑区实时同步到 archiveEditing，防重渲染丢内容 */
  body.querySelectorAll('.archive-edit').forEach(el => {
    if(!archiveEditing) return;
    if(el.dataset.scope !== archiveEditing.scope || el.dataset.key !== archiveEditing.key) return;
    const nameEl = el.querySelector('.edit-name');
    const kwEl = el.querySelector('.edit-keywords');
    const contentEl = el.querySelector('.edit-content');
    const sync = () => {
      if(archiveEditing && archiveEditing.scope === el.dataset.scope && archiveEditing.key === el.dataset.key){
        archiveEditing.name = nameEl.value;
        archiveEditing.keywords = kwEl.value;
        archiveEditing.content = contentEl.value;
      }
    };
    nameEl.addEventListener('input', sync);
    kwEl.addEventListener('input', sync);
    contentEl.addEventListener('input', sync);
  });
}

function migrateLocalToGlobal(){
  const conv = allConvs[currentId];
  if(!conv) return;
  const locals = getLocalArchives(conv);
  if(!locals.length){ alert('当前对话没有独立档案'); return; }
  if(!confirm('把当前对话的 ' + locals.length + ' 条独立档案迁入全局档案？\n\n名称和内容都相同的会被跳过。')) return;

  const globals = getGlobalArchives().slice();
  let moved = 0, skipped = 0;
  for(const it of locals){
    const dup = globals.find(g => g.name === it.name && g.content === it.content);
    if(dup){ skipped++; continue; }
    globals.push({
      key: uid('a'),
      name: it.name,
      keywords: (it.keywords && it.keywords.length) ? it.keywords.slice() : [it.name],
      content: it.content,
      enabled: it.enabled !== false
    });
    moved++;
  }
  if(moved === 0){
    alert('没有可迁移的档案（' + skipped + ' 条全部重复）。独立档案保持不变。');
    return;
  }
  saveGlobalArchives(globals);

  const clear = confirm('迁移完成：搬了 ' + moved + ' 条，跳过 ' + skipped + ' 条重复。\n\n点「确定」清空独立档案并关闭独立开关；\n点「取消」保留独立档案。');
  if(clear){
    conv.archives = [];
    conv.useLocalArchive = false;
    conv.updatedAt = Date.now();
    dbPut(conv).catch(() => {});
  }
  archiveEditing = null;
  renderArchives();
}

function collectArchiveHits(conv, query){
  let scan = String(query || '').toLowerCase();
  if(conv && conv.summary) scan += ' ' + conv.summary.toLowerCase();
  if(conv && conv.messages){
    let n = 0;
    for(let i = conv.messages.length - 1; i >= 0 && n < 3; i--){
      const m = conv.messages[i];
      if(m.role === 'user' && m.content){ scan += ' ' + m.content.toLowerCase(); n++; }
    }
  }
  const hits = [];
  if(isGlobalOn(conv)){
    for(const it of getGlobalArchives()){
      if(it.enabled === false) continue;
      for(const kw of (it.keywords || [])){
        if(kw && scan.includes(kw.toLowerCase())){ hits.push({ it: it, scope: 'global' }); break; }
      }
    }
  }
  if(isLocalOn(conv)){
    for(const it of getLocalArchives(conv)){
      if(it.enabled === false) continue;
      for(const kw of (it.keywords || [])){
        if(kw && scan.includes(kw.toLowerCase())){ hits.push({ it: it, scope: 'local' }); break; }
      }
    }
  }
  return hits;
}

function calculateArchiveScore(item, query){
  const q = String(query || '').toLowerCase();
  if(!q) return 0;
  let count = 0, len = 0;
  for(const kw of (item.keywords || [])){
    if(kw && q.includes(kw.toLowerCase())){
      count++;
      len += kw.length;
    }
  }
  return count * 1000 + len;
}

function getArchiveNumberMap(conv){
  const map = new Map();
  if(isGlobalOn(conv)){
    getGlobalArchives().forEach((it, i) => map.set(it.key, 'G' + (i + 1)));
  }
  if(isLocalOn(conv)){
    getLocalArchives(conv).forEach((it, i) => map.set(it.key, 'I' + (i + 1)));
  }
  return map;
}

function extractAndRemoveFullRequests(text){
  const ids = [];
  const cleaned = String(text || '').replace(
    /\[ARCHIVE_FULL\]\s*([GI]\d+)\s*\[\/ARCHIVE_FULL\]/gi,
    (m, id) => { ids.push(id.toUpperCase()); return ''; }
  ).trim();
  return { ids: ids, text: cleaned };
}

function validateFullRequests(requestedIds, injectedInfo){
  const truncatedIds = new Set(injectedInfo.filter(x => x.truncated).map(x => x.id));
  const valid = [];
  const seen = new Set();
  for(const id of requestedIds){
    if(seen.has(id)) continue;
    if(!truncatedIds.has(id)) continue;
    seen.add(id);
    valid.push(id);
    if(valid.length >= ARCHIVE_FULL_MAX) break;
  }
  return valid;
}

function processArchiveTags(text, conv){
  const globalArr = getGlobalArchives().slice();
  const localArr = getLocalArchives(conv).slice();
  const gOn = isGlobalOn(conv);
  const lOn = isLocalOn(conv);
  let changed = false;
  const notices = [];
  const dels = { global: [], local: [] };

  text = text.replace(/\[ARCHIVE_ADD\]\s*([\s\S]*?)\s*\[\/ARCHIVE_ADD\]/g, (m, body) => {
    const parts = body.split('|').map(s => s.trim());
    if(parts.length < 4) return '';
    const sw = parts[0].toLowerCase();
    let scope = null;
    if(sw === '全局' || sw === 'global' || sw === 'g') scope = 'global';
    else if(sw === '独立' || sw === 'local' || sw === 'l' || sw === 'isolated') scope = 'local';
    if(!scope) return '';
    const name = parts[1];
    if(scope === 'global' && !gOn){
      notices.push('AI 想把「' + name + '」写入全局档案，但全局档案已关闭');
      return '';
    }
    if(scope === 'local' && !lOn){
      notices.push('AI 想把「' + name + '」写入独立档案，但独立档案已关闭');
      return '';
    }
    const keywords = parts[2].split(/[,，]/).map(s => s.trim()).filter(Boolean);
    const content = parts.slice(3).join('|').trim();
    if(!name || !content) return '';
    const arr = scope === 'global' ? globalArr : localArr;
    const dup = arr.find(x => x.name === name && x.content === content);
    if(dup) return '';
    const sameName = arr.find(x => x.name === name);
    if(sameName){
      notices.push('「' + name + '」已存在同名档案，未覆盖');
      return '';
    }
    arr.push({ key: uid('a'), name: name, keywords: keywords.length ? keywords : [name], content: content, enabled: true });
    changed = true;
    return '';
  });

  text = text.replace(/\[ARCHIVE_UPDATE\]\s*([GI]\d+)\s*\|\s*([^|]*)\|\s*([^|]*)\|\s*([\s\S]*?)\s*\[\/ARCHIVE_UPDATE\]/gi, (m, id, name, keywords, content) => {
    const p = parseArchiveId(id);
    if(!p) return '';
    if(p.scope === 'global' && !gOn) return '';
    if(p.scope === 'local' && !lOn) return '';
    const arr = p.scope === 'global' ? globalArr : localArr;
    if(p.idx < 0 || p.idx >= arr.length) return '';
    const newName = String(name || '').trim();
    const newContent = String(content || '').trim();
    if(!newName || !newContent) return '';
    const newKeywords = String(keywords || '').split(/[,，]/).map(s => s.trim()).filter(Boolean);
    arr[p.idx].name = newName;
    arr[p.idx].keywords = newKeywords.length ? newKeywords : [newName];
    arr[p.idx].content = newContent;
    changed = true;
    return '';
  });

  text = text.replace(/\[ARCHIVE_DELETE\]\s*([GI]\d+)\s*\[\/ARCHIVE_DELETE\]/gi, (m, id) => {
    const p = parseArchiveId(id);
    if(!p) return '';
    if(p.scope === 'global' && !gOn) return '';
    if(p.scope === 'local' && !lOn) return '';
    if(p.idx >= 0) dels[p.scope].push(p.idx);
    return '';
  });

  for(const scope of ['global', 'local']){
    if(!dels[scope].length) continue;
    const arr = scope === 'global' ? globalArr : localArr;
    const uniq = Array.from(new Set(dels[scope])).sort((a, b) => b - a);
    for(const i of uniq){
      if(i < arr.length){ arr.splice(i, 1); changed = true; }
    }
  }

  if(changed){
    saveGlobalArchives(globalArr);
    saveArchivesOf(conv, localArr);
    renderArchives();
  }
  return { text: text.trim(), changed: changed, notices: notices };
}

/* ============ 配置 ============ */
function readConfig(){
  const tRaw = document.getElementById('temperature').value;
  const t = tRaw === '' ? null : Number(tRaw);
  const sk = document.getElementById('searchKey');
  const af = document.getElementById('allowArchiveFull');
  return {
    baseUrl: document.getElementById('baseUrl').value.trim() || 'https://api.deepseek.com/v1',
    apiKey: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('model').value.trim() || 'deepseek-chat',
    system: document.getElementById('systemPrompt').value.trim(),
    temperature: (t === null || Number.isNaN(t)) ? null : t,
    searchKey: sk ? sk.value.trim() : '',
    allowArchiveFull: !!(af && af.checked)
  };
}
function saveConfig(){
  const cfg = readConfig();
  const conv = allConvs[currentId];
  if(conv && conv.sysScope === 'isolated'){
    conv.system = cfg.system;
    conv.updatedAt = Date.now();
    try{ dbPut(conv).catch(() => {}); }catch(e){}
    let g = {};
    try{ g = JSON.parse(localStorage.getItem('chatConfig') || '{}'); }catch(e){}
    g.baseUrl = cfg.baseUrl; g.apiKey = cfg.apiKey; g.model = cfg.model;

function endpoint(base){
  let b = String(base || '').trim().replace(/\/+$/, '');
  if(!b) b = 'https://api.deepseek.com/v1';
  if(/\/chat\/completions$/.test(b)) return b;
  try{
    const u = new URL(b);
    if(u.pathname === '' || u.pathname === '/') b += '/v1';
  }catch(e){}
  return b + '/chat/completions';
}

/* system 只放稳定的内容：设定 + 摘要 + 记忆库 + 记忆指令 + 档案库索引 + 档案库指令 + 边界说明。 */
function buildSystemPrompt(cfg, conv, memWarn, archiveWarn){
  let sys = (cfg.system || '');
  if(conv && conv.summary){
    sys += '\n\n【前情提要】\n以下是这次对话较早部分的压缩摘要，用它来延续上下文：\n' + conv.summary;
  }
  const mem = getMemoryOf(conv);
  if(mem.length){
    sys += '\n\n【记忆库】\n' + mem.map((m, i) => (i + 1) + '. ' + m.content).join('\n');
  }
  if(memWarn && mem.length >= MEM_SOFT_LIMIT){
    sys += '\n\n【记忆整理提醒】\n当前记忆库有 ' + mem.length + ' 条，已偏多。';
    if(memWarn === 2){
      sys += '而且还在增加。请在本次回复末尾检查：'
        + '是否有语义重复的条目可以合并（合并时保留所有关键细节）、'
        + '是否有过时或不再准确的条目可以更新、'
        + '是否有确实不再需要的条目可以删除。'
        + '优先合并和更新，删除要谨慎，不要为了减少数量而丢掉用户身份、偏好或核心约定。'
        + '需要调整时，用 MEMORY_UPDATE / MEMORY_DELETE 标签处理；不需要调整就忽略这条提醒。';
    }else{
      sys += '如本次没有需要合并、更新或删除的条目，忽略这条提醒即可。';
    }
  }
  sys += '\n\n【记忆修改指令】\n'
    + '在回复最末尾（不要放正文中间）用以下格式修改记忆，一次可多条：\n\n'
    + '[MEMORY_ADD] 新内容 [/MEMORY_ADD]\n'
    + '[MEMORY_UPDATE] 编号 => 新内容 [/MEMORY_UPDATE]\n'
    + '[MEMORY_DELETE] 编号 [/MEMORY_DELETE]\n\n'
    + 'ADD 新增，UPDATE 改已有条目（写编号），DELETE 删彻底没用的。\n'
    + '只记真正重要、值得长期保留的信息（身份、称呼、偏好、禁忌、核心约定、当前项目核心状态），不记寒暄和临时内容。不需要修改就不输出这些标签。';

  const gOn = isGlobalOn(conv);
  const lOn = isLocalOn(conv);
  const globals = getGlobalArchives();
  const locals = getLocalArchives(conv);

  /* 记忆 vs 档案库（按开关裁剪：两个都关时整段不出现） */
  if(gOn || lOn){
    sys += '\n\n【记忆 vs 档案库】\n'
      + '两种写入位置，用途不同：\n'
      + '- 核心记忆（MEMORY_*）：每轮都必须知道的事——用户身份、称呼、偏好、禁忌、核心约定、当前项目的核心状态。量少、常驻上下文，每条每轮都被看到，写多了会挤占上下文、稀释注意力，只写"不记得就会出错"的事。\n';

    if(gOn && lOn){
      sys += '- 档案库（ARCHIVE_*）：不需要每轮都知道、但以后可能用到的事——具体人物关系、项目细节、术语定义、历史决定、文件/变量名、一次性结论。按关键词召回，命中才注入。\n'
        + '  分两个库：\n'
        + '  · 全局档案（G 编号）：跨对话共用——用户身份、通用偏好、长期项目、通用术语。\n'
        + '  · 独立档案（I 编号）：只属于当前对话——本对话才用的临时细节、特定约定。\n'
        + '  判断：换一个对话还要用吗？→ 是：全局；否：独立。拿不准：放独立。\n';
    }else if(gOn){
      sys += '- 档案库（ARCHIVE_*）：不需要每轮都知道、但以后可能用到的事——具体人物关系、项目细节、术语定义、历史决定、文件/变量名、一次性结论。\n'
        + '  只有全局档案（G 编号），跨对话共用。本对话的独立档案已关闭，不要往独立写。\n';
    }else{
      sys += '- 档案库（ARCHIVE_*）：不需要每轮都知道、但以后可能用到的事——具体人物关系、项目细节、术语定义、历史决定、文件/变量名、一次性结论。\n'
        + '  只有独立档案（I 编号），只属于当前对话。本对话不读取全局档案，不要往全局写。\n';
    }
    sys += '判断：这件事每轮都必须知道吗？→ 是：核心记忆；否：档案库。拿不准：写档案库。';
  }

  /* 索引 */
  if(gOn && globals.length){
    sys += '\n\n【全局档案索引】（G 开头，跨对话共用）\n';
    sys += globals.map((it, i) => 'G' + (i + 1) + ' | ' + it.name + ' | ' + (it.keywords || []).join(',')).join('\n');
  }
  if(lOn && locals.length){
    sys += '\n\n【独立档案索引】（I 开头，只属于本对话）\n';
    sys += locals.map((it, i) => 'I' + (i + 1) + ' | ' + it.name + ' | ' + (it.keywords || []).join(',')).join('\n');
  }

  /* 写入指令 */
  if(gOn || lOn){
    sys += '\n\n【档案库修改指令】\n'
      + '在回复最末尾（不要放正文中间）用以下格式修改档案库，一次可多条：\n\n';
    if(gOn && lOn) sys += '[ARCHIVE_ADD] 全局 | 名称 | 关键词1,关键词2 | 内容 [/ARCHIVE_ADD]\n[ARCHIVE_ADD] 独立 | 名称 | 关键词1,关键词2 | 内容 [/ARCHIVE_ADD]\n';
    else if(gOn) sys += '[ARCHIVE_ADD] 全局 | 名称 | 关键词1,关键词2 | 内容 [/ARCHIVE_ADD]\n';
    else sys += '[ARCHIVE_ADD] 独立 | 名称 | 关键词1,关键词2 | 内容 [/ARCHIVE_ADD]\n';
    sys += '[ARCHIVE_UPDATE] G1 | 名称 | 关键词1,关键词2 | 内容 [/ARCHIVE_UPDATE]\n'
      + '[ARCHIVE_DELETE] G1 [/ARCHIVE_DELETE]\n\n';
    if(gOn && lOn) sys += '第一段固定"全局"或"独立"。\n';
    else if(gOn) sys += '第一段固定"全局"。\n';
    else sys += '第一段固定"独立"。\n';
    sys += '关键词：专有名词、简称、别名、缩写、能指向它的独特描述；2–5 个；不要用通用词（项目、用户、系统、代码等）和单字。\n'
      + 'UPDATE 全字段覆盖：名称、关键词、内容三项都要写，只改内容时名称和关键词原样抄。\n'
      + '编号用索引里的（G1、I1 这种）。\n'
      + '什么时候写：用户给出新的人物/项目/术语/事件，或你正式命名了一个会反复出现的概念/文件/变量/约定，且不必每轮知道 → ADD；索引里已有该条目但本轮补全了信息（新关系、新进度、新细节）→ UPDATE；条目彻底作废才 DELETE。\n'
      + '同一件事先看索引里有没有，不要重复 ADD；不要在同一次回复里先 ADD 再 UPDATE 同一条（新加的条目还没有编号）。\n'
      + '不记：寒暄、临时内容、一次性路人、纯情绪表达。不需要修改就不输出这些标签。';
  }

  /* 档案全文请求 */
  if(cfg.allowArchiveFull && (gOn || lOn)){
    sys += '\n\n【档案全文请求】\n'
      + '本轮注入的档案如果超过 ' + ARCHIVE_CONTENT_MAX + ' 字，末尾会标「…[截断，共 X 字]」。\n'
      + '若被截断的部分对回答当前问题很关键，可在回复最末尾输出：\n\n'
      + '[ARCHIVE_FULL] G1 [/ARCHIVE_FULL]\n'
      + '[ARCHIVE_FULL] I2 [/ARCHIVE_FULL]\n\n'
      + '系统会自动注入这几个档案的完整内容，然后让你基于完整内容重新回答。\n'
      + '每轮最多请求 ' + ARCHIVE_FULL_MAX + ' 条；只能请求本轮已注入且被标记截断的档案；不确定、或缺的不是关键信息，就不要请求。';
  }

  const totalVisible = (gOn ? globals.length : 0) + (lOn ? locals.length : 0);
  if(archiveWarn && totalVisible >= ARCHIVE_SOFT_LIMIT){
    sys += '\n\n【档案库整理提醒】\n当前可见档案 ' + totalVisible + ' 条，索引偏长。';
    if(archiveWarn === 2){
      sys += '请检查：是否有可合并的重复条目、需更新的过时条目、确实不再需要的条目；优先合并和更新，删除要谨慎。需要调整就用 ARCHIVE_UPDATE / ARCHIVE_DELETE，不需要就忽略这条提醒。';
    }else{
      sys += '如无需合并、更新或删除，忽略这条提醒即可。';
    }
  }
  return sys;
}

/* ============ 联网搜索 ============ */
function searchOn(){ return localStorage.getItem('chatSearchOn') === '1'; }
function setSearchOn(v){
  localStorage.setItem('chatSearchOn', v ? '1' : '0');
  const btn = document.getElementById('searchBtn');
  if(btn) btn.classList.toggle('on', !!v);
}
async function webSearch(query, key, outerSignal){
  const ctrl = new AbortController();
  const onAbort = () => { try{ ctrl.abort(); }catch(e){} };
  let to = 0;
  if(outerSignal){
    if(outerSignal.aborted) onAbort();
    else outerSignal.addEventListener('abort', onAbort);
  }
  to = setTimeout(onAbort, 15000);
  try{
    const resp = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: key, query: query, max_results: 5, search_depth: 'basic', include_answer: true }),
      signal: ctrl.signal
    });
    if(!resp.ok){
      let detail = '';
      try{ detail = (await resp.text()).slice(0, 160); }catch(e){}
      throw new Error('HTTP ' + resp.status + (detail ? '：' + detail : ''));
    }
    const data = await resp.json();
    const lines = [];
    if(data && data.answer) lines.push('摘要：' + data.answer);
    ((data && data.results) || []).forEach((r, i) => {
      lines.push('[' + (i + 1) + '] ' + (r.title || '') + '\n' + (r.url || '') + '\n' + String(r.content || '').slice(0, 600));
    });
    if(!lines.length) throw new Error('没有搜到结果');
    return '【联网搜索结果】\n' + lines.join('\n\n');
  }finally{
    clearTimeout(to);
    if(outerSignal) outerSignal.removeEventListener('abort', onAbort);
  }
}
function lastUserText(conv){
  for(let i = conv.messages.length - 1; i >= 0; i--){
    const m = conv.messages[i];
    if(m.role === 'user' && m.content && m.content.trim()) return m.content.trim();
  }
  return '';
}

  /* 兼容 RPG 版导入：保留旧动态注入字段，不丢检索内容 */

async function sealConversation(){

  const cfg = readConfig();
  if(!cfg.apiKey){

    return;
  }

  if(conv.sealed){
    if(!confirm('解除封存？解除后旧原文有可能被重新检索进来。')) return;
    conv.sealed = false;
    conv.updatedAt = Date.now();
    try{ await dbPut(conv); }catch(e){}
    renderChat(false);
    updateTitle();
    return;
  }

  if(!conv.messages.length){ alert('当前对话还没有内容'); return; }
  if(!confirm('把目前的消息压成一段摘要，并停止读取它们的原文？\n\n摘要会保留要点和约定，但具体代码和大段原文之后不再送进上下文。')) return;

  const ok = await maybeSummarize(conv, cfg, true);
  if(!ok){
    alert('摘要没成功，为了不丢内容，这次没有封存。等会儿可以再试一次。');
    return;
  }
  conv.sealed = true;
  conv.updatedAt = Date.now();
  try{ await dbPut(conv); }catch(e){}
  renderChat(false);
  renderSidebar();
  updateTitle();
}

/* ============ 修剪：只保留最近 TRIM_KEEP 条消息 ============ */
/* 保留条数 = 检索池上限：修剪后剩下的消息全部落在可检索范围内。
   未摘要的原文由 SUMMARY_TRIGGER 自动压缩，修剪只允许删"已进摘要"的部分。 */
const TRIM_KEEP = RAG_MAX_POOL;   // 240
let trimBusy = false;

/* 三选一弹窗：save=备份成功可继续删除，delete=仅删除，cancel=取消。
   "保存并删除"按钮在用户手势内同步触发 tryExportCurrent，尽量让浏览器允许系统保存框。 */
function askTrimBackup(delCount){
  return new Promise(resolve => {
    const mask = document.getElementById('trimModal');
    const msgEl = document.getElementById('trimModalMsg');
    if(!mask || !msgEl){ resolve('cancel'); return; }

    msgEl.textContent = '即将删除最早的 ' + delCount + ' 条消息，只保留最近 ' + TRIM_KEEP + ' 条。\n\n'
      + '这些消息都已压缩进摘要，删除后要点仍保留在摘要中。\n\n'
      + '「保存并删除」= 先导出 .json 备份，备份失败则不删除\n'
      + '「仅删除」= 不导出，直接删除\n'
      + '「取消」= 什么都不做';

    let done = false;
    const cleanup = (v) => {
      if(done) return;
      done = true;
      mask.hidden = true;
      mask.querySelectorAll('button[data-trim]').forEach(b => { b.onclick = null; });
      mask.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onKey = (e) => { if(e.key === 'Escape') cleanup('cancel'); };

    document.addEventListener('keydown', onKey);

    const saveBtn = mask.querySelector('button[data-trim="save"]');
    const delBtn = mask.querySelector('button[data-trim="delete"]');
    const cancelBtn = mask.querySelector('button[data-trim="cancel"]');

    saveBtn.onclick = async () => {
      if(done) return;
      saveBtn.disabled = true;
      saveBtn.textContent = '正在备份…';
      let r;
      try{
        r = await tryExportCurrent();
      }catch(e){
        r = { ok: false, reason: (e && e.message) || String(e) };
      }
      if(done) return;
      if(!r.ok){
        saveBtn.disabled = false;
        saveBtn.textContent = '保存并删除';
        alert('备份失败：' + r.reason + '\n\n为保护数据，本次不删除。\n如需不备份直接删除，请重新点 ✂️ 并选择「仅删除」。');
        cleanup('cancel');
        return;
      }
      if(!r.confirmed){
        if(!confirm('备份已触发下载，但浏览器无法确认是否保存成功。\n\n请确认 .json 文件已保存到本地后点「确定」继续删除；\n否则点「取消」放弃删除。')){
          cleanup('cancel');
          return;
        }
      }
      cleanup('save');
    };
    delBtn.onclick = () => cleanup('delete');
    cancelBtn.onclick = () => cleanup('cancel');
    mask.onclick = (e) => { if(e.target === mask) cleanup('cancel'); };

    mask.hidden = false;
    if(saveBtn) saveBtn.focus();
  });
}

async function trimConversation(){
  if(trimBusy) return;
  const conv = allConvs[currentId];
  if(!conv) return;

  if(busy){ alert('等这一轮回复结束再修剪吧'); return; }

  /* 本对话正在压缩摘要 → 禁止修剪（别的会话在压缩不影响） */
  if(summaryBusy && summaryConvId === conv.id){
    alert('本对话正在压缩摘要，请等摘要完成后再修剪。');
    return;
  }

  const total = conv.messages.length;
  if(total <= TRIM_KEEP){
    alert('当前对话只有 ' + total + ' 条消息，还没到 ' + TRIM_KEEP + ' 条，不用修剪。');
    return;
  }

  const delCount = total - TRIM_KEEP;
  const summarized = conv.summarized || 0;

  /* 只允许删已进摘要的部分，未压缩的一条都不许删 */
  if(delCount > summarized){
    const unprotected = delCount - summarized;
    alert('不能修剪：最早的 ' + delCount + ' 条里有 ' + unprotected + ' 条还没压缩进摘要。\n\n'
      + '删掉会永久丢失这些内容。请先点 📦 封存，或等自动摘要完成后再试。');
    return;
  }

  trimBusy = true;
  try{
    const choice = await askTrimBackup(delCount);
    if(choice === 'cancel') return;

    /* 弹窗/备份期间可能刚好开始了摘要，删除前再确认一次 */
    if(summaryBusy && summaryConvId === conv.id){
      alert('摘要任务刚开始，为安全起见本次不删除，请稍后重试。');
      return;
    }

    if(!confirm('确认删除最早的 ' + delCount + ' 条消息？\n\n删除后不可撤销。')) return;

    conv.messages = conv.messages.slice(delCount);
    conv.summarized = summarized - delCount;
    conv.summaryTrimmed = (conv.summaryTrimmed || 0) + delCount;
    conv.updatedAt = Date.now();
    try{ await dbPut(conv); }catch(e){}

    renderChat(true);
    renderSidebar();
    updateTitle();
    updateMemUsage();
    alert('已删除 ' + delCount + ' 条，当前保留 ' + conv.messages.length + ' 条。');
  }finally{
    trimBusy = false;
  }
}

/* 修剪专用：能返回"到底备份成功没有" */
async function tryExportCurrent(){
  const conv = allConvs[currentId];
  if(!conv) return { ok: false, reason: '没有可导出的对话' };
  const data = { version: 3, exportedAt: new Date().toISOString(), conversations: [conv] };
  const json = JSON.stringify(data, null, 2);
  const fileName = (conv.title || 'chat').replace(/[\\/:*?"<>|]/g, '_') + '.json';

  /* 优先用能确认结果的保存框（Chrome / Edge 支持） */
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'JSON 备份', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      return { ok: true, confirmed: true };   /* 确认写盘成功 */
    }catch(e){
      if(e && e.name === 'AbortError') return { ok: false, reason: '你取消了保存' };
      /* 其它错误（没手势 / 不支持）→ 回退到自动下载 */
    }
  }

  /* 回退：自动下载，但浏览器不告诉我们是否成功，只能让用户确认 */
  try{
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return { ok: true, confirmed: false };     /* 没确认，需要用户点一下 */
  }catch(e){
    return { ok: false, reason: (e && e.message) || String(e) };
  }
}

async function importAll(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const convs = Array.isArray(data) ? data : (data.conversations || []);
    let imported = 0;
    for(const c of convs){
      if(!c || !c.id || !Array.isArray(c.messages)) continue;
      let id = c.id;
      if(allConvs[id]) id = c.id + '_imp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const conv = {
        id: id, title: c.title || '导入对话',
        messages: c.messages.map(normalizeMsg),
        summary: c.summary || '', summarized: c.summarized || 0,
        summaryTrimmed: typeof c.summaryTrimmed === 'number' ? c.summaryTrimmed : 0,
        sealed: !!c.sealed,
        memScope: c.memScope === 'isolated' ? 'isolated' : 'global',
        memory: Array.isArray(c.memory) ? c.memory : [],
        archives: Array.isArray(c.archives) ? c.archives.map(normArchiveItem) : [],
        lastArchiveWarn: typeof c.lastArchiveWarn === 'number' ? c.lastArchiveWarn : 0,
        useGlobalArchive: c.useGlobalArchive !== false,
        useLocalArchive: c.useLocalArchive !== false,
        sysScope: c.sysScope === 'isolated' ? 'isolated' : 'global',
        system: typeof c.system === 'string' ? c.system : '',
        lastUserAt: typeof c.lastUserAt === 'number' ? c.lastUserAt : 0,
        lastMemWarn: typeof c.lastMemWarn === 'number' ? c.lastMemWarn : 0,
        createdAt: c.createdAt || Date.now(), updatedAt: c.updatedAt || Date.now()
      };
      allConvs[id] = conv;
      await dbPut(conv);
      imported++;
    }
    if(data.memory && Array.isArray(data.memory)){
      const mem = getMemory();
      const seen = new Set(mem.map(m => m.content));
      data.memory.forEach(m => {
        if(m && m.content && !seen.has(m.content)){ mem.push({ content: m.content }); seen.add(m.content); }
      });
      saveMemory(mem);
      renderMemory();
    }
    if(data.globalArchives && Array.isArray(data.globalArchives)){
      const gArr = getGlobalArchives().slice();
      const seen = new Set(gArr.map(x => x.name + '\u0001' + x.content));
      data.globalArchives.forEach(x => {
        if(!x || !x.name || !x.content) return;
        const k = String(x.name) + '\u0001' + String(x.content);
        if(seen.has(k)) return;
        gArr.push(normArchiveItem(x));
        seen.add(k);
      });
      saveGlobalArchives(gArr);
    }
    renderSidebar();
    renderArchives();
    alert(imported ? '导入成功，共 ' + imported + ' 个对话' : '没有可导入的对话');
  }catch(e){ alert('导入失败：' + e.message); }
}

function renderChat(forceScroll){
  const chat = document.getElementById('chat');

function syncSummaryBar(conv){
  const chat = document.getElementById('chat');
  if(!chat || !conv) return;
  /* 有摘要就显示。修剪可能让 summarized 归零，但摘要仍有效。 */
  const shouldShow = !!conv.summary;
  let bar = chat.querySelector('.summary-bar');

  if(!shouldShow){ if(bar) bar.remove(); return; }

  if(!bar){
    bar = document.createElement('div');
    bar.className = 'summary-bar';
    bar.innerHTML = '<span class="sum-count"></span>'
      + '<button type="button" class="summary-toggle">查看</button>'
      + '<div class="summary-text" hidden></div>';
    bar.querySelector('.summary-toggle').onclick = ev => {
      const t = bar.querySelector('.summary-text');
      t.hidden = !t.hidden;
      ev.target.textContent = t.hidden ? '查看' : '收起';
    };
    chat.insertBefore(bar, chat.firstChild);
  }

  const covers = (conv.summarized || 0) + (conv.summaryTrimmed || 0);  /* 摘要实际覆盖的总条数 */
  const sealTag = conv.sealed ? ' · 已封存，不再读取原文' : '';
  const newCount = covers > 0
    ? '📝 早期 ' + covers + ' 条消息已压缩为摘要' + sealTag
    : '📝 前情提要（早期原文已修剪删除）' + sealTag;
  const countEl = bar.querySelector('.sum-count');
  if(countEl.textContent !== newCount) countEl.textContent = newCount;

  const txt = bar.querySelector('.summary-text');
  if(txt.textContent !== conv.summary) txt.textContent = conv.summary;
}

function createMsgEl(m, isLastAi){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
  if(m.error) wrap.classList.add('error');
  wrap.dataset.key = m.key;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if(m.pending && !m.content && !m.think) bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  else if(!m.content && m.notice) bubble.innerHTML = '<span class="notice">' + escapeHtml(m.notice) + '</span>';
  else if(m.role === 'user') bubble.innerHTML = escapeHtml(m.content).replace(/\n/g, '<br>');
  else{
    const mdBody = document.createElement('div');
    mdBody.className = 'md-body';
    mdBody.innerHTML = mdToHtml(stripRpgTagsForDisplay(m.content || '')) + (m.pending ? '<span class="caret"></span>' : '');
    bubble.appendChild(mdBody);
    if(m.think){
      const open = (m.thinkOpen !== undefined) ? m.thinkOpen : (!!m.pending || !!isLastAi);
      attachThinkBlock(bubble, m.think, open);
    }
  }
  wrap.appendChild(bubble);
  if(m.notice && m.content){
    const nb = document.createElement('div');
    nb.className = 'notice-bar';
    nb.textContent = m.notice;
    wrap.appendChild(nb);
  }
  if(m.ragNotice){
    const rb = document.createElement('div');
    rb.className = 'rag-bar';
    rb.textContent = m.ragNotice;
    wrap.appendChild(rb);
  }
  const actions = document.createElement('div');
  actions.className = 'actions';
  const copyBtn = document.createElement('button');
  copyBtn.dataset.act = 'copy'; copyBtn.textContent = '复制';
  actions.appendChild(copyBtn);
  if(m.role === 'assistant' && isLastAi && !busy){
    const reBtn = document.createElement('button');
    reBtn.dataset.act = 'regen'; reBtn.textContent = '重新生成';
    actions.appendChild(reBtn);
  }
  if(!busy){
    const delBtn = document.createElement('button');
    delBtn.dataset.act = 'delete'; delBtn.textContent = '删除';
    actions.appendChild(delBtn);
  }
  wrap.appendChild(actions);
  return wrap;
}
